<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蓄電池リース ラインナップ｜ミライエコ＋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16324F;
    --ink-soft: #4A6380;
    --line: #D6E0EA;
    --page: #EEF3F7;
    --paper: #FFFFFF;
    --brand: #1F5FBF;
    --brand-deep: #123F86;
    --sun: #F2A516;
    --sun-tint: #FFF6E2;
    --leaf: #2E8B6E;
    --leaf-tint: #E4F4EE;
    --num: 'Barlow Semi Condensed', 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    --txt: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--txt);
    background: var(--page);
    color: var(--ink);
    line-height: 1.5;
    padding-bottom: 140px;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  /* ===== ヘッダー ===== */
  header {
    background: var(--brand-deep);
    color: #fff;
  }
  .header-inner {
    max-width: 1180px; margin: 0 auto;
    padding: 18px 20px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge-sbi {
    background: #fff; color: var(--brand-deep);
    font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 3px;
  }
  .updated { font-size: 0.75rem; color: rgba(255,255,255,0.75); }
  header h1 { font-size: clamp(1.35rem, 3.6vw, 2rem); font-weight: 900; letter-spacing: 0.04em; line-height: 1.25; }
  header .sub { font-size: 0.85rem; color: rgba(255,255,255,0.85); margin-top: 2px; }
  .header-logo {
    flex-shrink: 0; background: #fff; border-radius: 10px; padding: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-logo img { height: 64px; width: auto; display: block; }

  /* ===== 操作パネル（スクロール追従） ===== */
  .controls {
    position: sticky; top: 0; z-index: 50;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .controls-inner {
    max-width: 1180px; margin: 0 auto; padding: 12px 20px;
    display: grid; grid-template-columns: auto 1fr; gap: 12px 20px; align-items: center;
  }
  .period {
    display: inline-grid; grid-template-columns: 1fr 1fr;
    background: var(--page); border-radius: 10px; padding: 4px; gap: 4px;
  }
  .period button {
    border: 0; background: transparent; cursor: pointer;
    padding: 8px 18px; border-radius: 7px;
    font-weight: 700; font-size: 0.95rem; color: var(--ink-soft);
    display: flex; flex-direction: column; align-items: center; line-height: 1.2;
  }
  .period button small { font-size: 0.66rem; font-weight: 500; }
  .period button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .filters { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .filter-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .filter-label { font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); width: 4.5em; flex-shrink: 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid var(--line); background: var(--paper); cursor: pointer;
    padding: 5px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 500;
    white-space: nowrap; flex-shrink: 0;
  }
  .chip:hover { border-color: var(--brand); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip.sun[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--ink); }
  .row-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sort {
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
    padding: 5px 8px; font-size: 0.8rem; font-family: inherit; color: var(--ink);
  }
  .reset-btn {
    border: 0; background: none; cursor: pointer; font-size: 0.8rem;
    color: var(--brand); font-weight: 700; text-decoration: underline; text-underline-offset: 3px;
  }
  .result-count { font-size: 0.8rem; color: var(--ink-soft); margin-left: auto; }
  .result-count b { font-family: var(--num); font-size: 1.05rem; color: var(--ink); }

  /* ===== 一覧 ===== */
  .container { max-width: 1180px; margin: 0 auto; padding: 20px 20px 40px; }
  .maker-section { margin-bottom: 28px; }
  .maker-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 0 4px 8px; border-bottom: 3px solid var(--ink);
    margin-bottom: 4px;
  }
  .maker-head h2 { font-size: 1.15rem; font-weight: 900; }
  .maker-head span { font-size: 0.78rem; color: var(--ink-soft); }

  .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .row {
    display: grid;
    grid-template-columns: 74px 1fr auto auto;
    align-items: center; gap: 12px;
    padding: 12px 8px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: relative;
  }
  .row.in-compare { background: #EAF1FC; box-shadow: inset 4px 0 0 var(--brand); }

  /* 容量ゲージ（電池の残量表示） */
  .gauge { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .gauge-cap { font-family: var(--num); font-weight: 700; font-size: 1.35rem; line-height: 1; letter-spacing: -0.01em; }
  .gauge-cap small { font-size: 0.72rem; font-weight: 600; margin-left: 1px; }
  .battery {
    width: 62px; height: 14px; border: 2px solid var(--ink); border-radius: 3px;
    position: relative; padding: 1px;
  }
  .battery::after {
    content: ''; position: absolute; right: -5px; top: 3px; width: 3px; height: 4px;
    background: var(--ink); border-radius: 0 1px 1px 0;
  }
  .battery i { display: block; width: 100%; height: 100%; background: var(--leaf); border-radius: 1px; }
  .gauge.v2h .gauge-cap { font-size: 0.95rem; font-family: var(--txt); font-weight: 900; color: var(--leaf); }

  .info { min-width: 0; }
  .info-name { font-size: 0.9rem; font-weight: 700; line-height: 1.35; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tag {
    font-size: 0.66rem; font-weight: 700; padding: 1px 6px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--ink-soft); background: var(--paper);
  }
  .tag.hybrid { border-color: var(--brand); color: var(--brand); }
  .tag.v2h { border-color: var(--leaf); color: var(--leaf); }
  .tag.sochiku { background: var(--sun-tint); border-color: var(--sun); color: #7A4F00; }
  .catalog { font-size: 0.72rem; color: var(--brand); font-weight: 700; margin-left: 2px; }

  .price { text-align: right; white-space: nowrap; }
  .price-main { font-family: var(--num); font-weight: 700; font-size: 1.7rem; line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .price-main small { font-family: var(--txt); font-size: 0.72rem; font-weight: 700; margin-left: 2px; }
  .price-tax { font-size: 0.72rem; color: var(--ink-soft); margin-top: 3px; }

  .cmp {
    height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--brand); background: var(--paper);
    font-size: 0.78rem; font-weight: 700; color: var(--brand);
    display: inline-flex; align-items: center; justify-content: center; min-width: 108px; white-space: nowrap;
  }
  .cmp:hover { background: #EAF1FC; }
  .cmp[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .no-result { text-align: center; padding: 48px 16px; color: var(--ink-soft); }
  .no-result button { margin-top: 10px; }

  .note {
    margin-top: 12px; padding: 14px 16px; background: var(--paper);
    border-left: 4px solid var(--ink-soft);
    font-size: 0.78rem; color: var(--ink-soft); line-height: 1.8;
  }

  footer {
    text-align: center; font-size: 0.75rem; color: var(--ink-soft);
    padding: 20px 16px; line-height: 1.8;
  }

  /* ===== 比較バー ===== */
  #compare-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--ink); color: #fff;
    transform: translateY(100%); transition: transform 0.25s ease;
  }
  #compare-bar.visible { transform: translateY(0); }
  .cb-inner { max-width: 1180px; margin: 0 auto; padding: 10px 20px 12px; }
  .cb-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .cb-title { font-weight: 700; font-size: 0.88rem; }
  .cb-title span { font-weight: 500; color: rgba(255,255,255,0.7); font-size: 0.78rem; margin-left: 4px; }
  .cb-actions { margin-left: auto; display: flex; gap: 8px; }
  .cb-clear { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
  .cb-open { background: var(--sun); border: 0; color: var(--ink); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-weight: 900; font-size: 0.85rem; }
  .cb-items { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .cb-items::-webkit-scrollbar { display: none; }
  .cb-item {
    flex-shrink: 0; background: rgba(255,255,255,0.1); border-radius: 8px;
    padding: 6px 30px 6px 10px; position: relative; min-width: 150px;
  }
  .cb-item-name { font-size: 0.7rem; color: rgba(255,255,255,0.8); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb-item-price { font-family: var(--num); font-weight: 700; font-size: 1.05rem; }
  .cb-item-price small { font-family: var(--txt); font-size: 0.66rem; font-weight: 500; color: rgba(255,255,255,0.7); margin-left: 6px; }
  .cb-remove {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; font-size: 0.75rem;
  }

  /* ===== 比較モーダル ===== */
  #compare-modal {
    position: fixed; inset: 0; z-index: 100; background: rgba(22,50,79,0.55);
    display: none; align-items: flex-end; justify-content: center;
  }
  #compare-modal.open { display: flex; }
  .modal-inner {
    background: var(--paper); width: 100%; max-width: 1000px; max-height: 88vh;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  }
  .modal-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal-title { font-weight: 900; font-size: 1.05rem; }
  .modal-title span { font-weight: 500; font-size: 0.8rem; color: var(--ink-soft); margin-left: 8px; }
  .modal-close { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 1rem; }
  .table-wrap { overflow: auto; padding: 0 0 16px; }
  .cmp-table { border-collapse: collapse; width: 100%; min-width: 520px; }
  .cmp-table th, .cmp-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .cmp-table thead th { position: sticky; top: 0; background: var(--paper); z-index: 1; }
  .cmp-table th[scope="row"] { font-size: 0.75rem; color: var(--ink-soft); font-weight: 700; white-space: nowrap; width: 7em; background: var(--page); }
  .cmp-maker { font-size: 0.72rem; color: var(--ink-soft); font-weight: 500; }
  .cmp-name { font-size: 0.88rem; font-weight: 700; }
  .cmp-num { font-family: var(--num); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .cmp-num small { font-family: var(--txt); font-size: 0.7rem; margin-left: 2px; }
  td.best { background: var(--leaf-tint); }
  .best-mark { display: inline-block; font-size: 0.66rem; font-weight: 900; color: #fff; background: var(--leaf); padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }

  /* ===== レスポンシブ ===== */
  @media (max-width: 900px) {
    .rows { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .header-inner { padding: 14px 16px 16px; }
    .header-logo img { height: 44px; }
    .controls { position: static; }
    header h1 { font-size: 1.3rem; }
    .controls-inner { grid-template-columns: 1fr; padding: 10px 16px; gap: 10px; }
    .period { width: 100%; }
    .container { padding: 16px 12px 40px; }
    .row { grid-template-columns: 64px 1fr auto; gap: 10px; padding: 12px 6px; }
    .cmp { grid-column: 3; grid-row: 2; justify-self: end; height: 30px; padding: 0 10px; font-size: 0.75rem; min-width: 100px; }
    .price-main { font-size: 1.45rem; }
    .battery { width: 54px; }
    .cb-inner { padding: 10px 12px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #compare-bar { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand-line">
        <span class="badge-sbi">SBI 新生銀行グループ</span>
        <span class="updated" id="updated"></span>
      </div>
      <h1 id="page-title">ミライエコ＋ 蓄電池リース</h1>
      <p class="sub">月々のリース料金一覧</p>
    </div>
    <div class="header-logo">
      <img src="makingenergy1.png" alt="メイキングエナジー">
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="period" role="group" aria-label="リース期間">
      <button type="button" id="btn-10" aria-pressed="true" onclick="setLeasePeriod(10)">10年リース<small>満了後は無償譲渡</small></button>
      <button type="button" id="btn-15" aria-pressed="false" onclick="setLeasePeriod(15)">15年リース<small>満了後は無償譲渡</small></button>
    </div>

    <div class="filters" id="filter-section">
      <div class="filter-row" id="row-maker">
        <div class="filter-label">メーカー</div>
        <div class="chips" id="filter-maker"></div>
      </div>
      <div class="filter-row" id="row-type">
        <div class="filter-label">タイプ</div>
        <div class="chips">
          <button type="button" class="chip" data-group="type" data-val="ハイブリッド" aria-pressed="false" onclick="toggleFilter(this)">ハイブリッド</button>
          <button type="button" class="chip" data-group="type" data-val="単機能" aria-pressed="false" onclick="toggleFilter(this)">単機能</button>
          <button type="button" class="chip" data-group="type" data-val="V2H" aria-pressed="false" onclick="toggleFilter(this)">V2H</button>
          <span id="row-load" style="display:contents">
            <button type="button" class="chip" data-group="load" data-val="全負荷" aria-pressed="false" onclick="toggleFilter(this)">全負荷</button>
            <button type="button" class="chip" data-group="load" data-val="特定負荷" aria-pressed="false" onclick="toggleFilter(this)">特定負荷</button>
          </span>
          <span id="row-sochiku" style="display:contents">
            <button type="button" class="chip sun" data-group="sochiku" data-val="true" aria-pressed="false" onclick="toggleFilter(this)">創蓄連携割引の対象</button>
          </span>
        </div>
      </div>
      <div class="row-tools">
        <select class="sort" id="sort" onchange="applyFilters()" aria-label="並び順">
          <option value="default">メーカー別に表示</option>
          <option value="price">月額が安い順</option>
          <option value="cap">容量が大きい順</option>
          <option value="cpk">1kWhあたりが安い順</option>
        </select>
        <button type="button" class="reset-btn" onclick="resetFilters()">条件をクリア</button>
        <div class="result-count" id="result-count"></div>
      </div>
    </div>
  </div>
</div>

<main class="container">
  <div id="lineup"></div>
  <div class="note" id="note-text"></div>
</main>

<footer>
  株式会社メイキングエナジー｜TEL: 0857-88-9731<br>
  鳥取支店：鳥取市吉方温泉4-719 MORIビル2F｜福岡支店：久留米市本町2-23 豊国産業ビル2F
</footer>

<div id="compare-bar" aria-live="polite">
  <div class="cb-inner">
    <div class="cb-head">
      <div class="cb-title">比較リスト<span id="compare-count"></span></div>
      <div class="cb-actions">
        <button type="button" class="cb-clear" onclick="clearCompare()">クリア</button>
        <button type="button" class="cb-open" onclick="openModal()">並べて比較</button>
      </div>
    </div>
    <div class="cb-items" id="compare-items"></div>
  </div>
</div>

<div id="compare-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-inner">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">並べて比較<span id="modal-period"></span></div>
      <button type="button" class="modal-close" onclick="closeModal()" aria-label="閉じる">✕</button>
    </div>
    <div class="table-wrap" id="compare-table"></div>
  </div>
</div>

<script>
  let allProducts = [];
  let settings = {};
  let noteTextRaw = '';
  const activeFilters = { maker: [], type: [], load: [], sochiku: [] };
  let compareList = [];
  let leasePeriod = 10;
  let maxCap = 1;

  const ts = '?t=' + Date.now();

  Promise.all([
    fetch('settings.json' + ts).then(r => r.json()),
    fetch('lineup.json' + ts).then(r => r.json())
  ]).then(([s, d]) => {
    settings = s;
    allProducts = d.products.map((p, i) => ({ ...p, _id: i }));
    const caps = allProducts.map(p => parseFloat(p.capacity)).filter(v => !isNaN(v));
    maxCap = caps.length ? Math.max(...caps) : 1;
    applySettings();
    document.getElementById('updated').textContent = '最終更新 ' + d.updated;
    buildMakerFilters(allProducts);
    applyFilters();
  }).catch(() => {
    document.getElementById('lineup').innerHTML =
      '<div class="no-result">料金データを読み込めませんでした。ページを再読み込みしてください。</div>';
  });

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen = n => Number(n).toLocaleString();

  function setLeasePeriod(period) {
    leasePeriod = period;
    document.getElementById('btn-10').setAttribute('aria-pressed', period === 10);
    document.getElementById('btn-15').setAttribute('aria-pressed', period === 15);
    renderNote();
    applyFilters();
    if (compareList.length > 0) updateCompareBar();
    if (document.getElementById('compare-modal').classList.contains('open')) openModal();
  }

  function getPrice(p) {
    return leasePeriod === 15
      ? { ex: p.price_ex15 ?? p.price_ex, inTax: p.price_in15 ?? p.price_in }
      : { ex: p.price_ex, inTax: p.price_in };
  }

  function applySettings() {
    const f = settings.features || {};
    const d = settings.display || {};
    if (d.page_title) {
      document.getElementById('page-title').textContent = d.page_title;
      document.title = d.page_title + ' | ミライエコ＋';
    }
    noteTextRaw = d.note_text || '';
    renderNote();
    if (f.filter_maker === false) document.getElementById('row-maker').style.display = 'none';
    if (f.filter_type  === false) document.querySelectorAll('[data-group="type"]').forEach(b => b.style.display = 'none');
    if (f.filter_load  === false) document.getElementById('row-load').style.display = 'none';
    if (f.filter_sochiku === false) document.getElementById('row-sochiku').style.display = 'none';
    if (f.filter_type === false && f.filter_load === false && f.filter_sochiku === false)
      document.getElementById('row-type').style.display = 'none';
    if (f.compare_mode === false) document.getElementById('compare-bar').style.display = 'none';
  }

  // 注意書きの「リース期間：10年間」を選択中の期間に合わせて表示
  function renderNote() {
    const el = document.getElementById('note-text');
    if (!noteTextRaw) { el.style.display = 'none'; return; }
    const txt = noteTextRaw.replace(/リース期間：\d+年間/, `リース期間：${leasePeriod}年間`);
    el.innerHTML = esc(txt).replace(/\n/g, '<br>');
  }

  function buildMakerFilters(products) {
    const makers = [...new Set(products.map(p => p.maker))];
    document.getElementById('filter-maker').innerHTML = makers.map(m =>
      `<button type="button" class="chip" data-group="maker" data-val="${esc(m)}" aria-pressed="false" onclick="toggleFilter(this)">${esc(m)}</button>`
    ).join('');
  }

  function toggleFilter(btn) {
    const group = btn.dataset.group;
    const val = btn.dataset.val;
    const idx = activeFilters[group].indexOf(val);
    if (idx === -1) activeFilters[group].push(val); else activeFilters[group].splice(idx, 1);
    btn.setAttribute('aria-pressed', idx === -1);
    applyFilters();
  }

  function resetFilters() {
    Object.keys(activeFilters).forEach(k => activeFilters[k] = []);
    document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
    document.getElementById('sort').value = 'default';
    applyFilters();
  }

  function applyFilters() {
    let filtered = allProducts;
    if (activeFilters.maker.length)   filtered = filtered.filter(p => activeFilters.maker.includes(p.maker));
    if (activeFilters.type.length)    filtered = filtered.filter(p => activeFilters.type.includes(p.type));
    if (activeFilters.load.length)    filtered = filtered.filter(p => activeFilters.load.includes(p.load));
    if (activeFilters.sochiku.length) filtered = filtered.filter(p => p.sochiku === true);
    renderCards(filtered);
  }

  function calcCostPerKwh(p) {
    const cap = parseFloat(p.capacity);
    if (isNaN(cap) || cap <= 0) return null;
    return Math.round(getPrice(p).ex / cap);
  }

  function sortProducts(list, mode) {
    const arr = [...list];
    const big = Number.MAX_SAFE_INTEGER;
    if (mode === 'price') arr.sort((a, b) => getPrice(a).ex - getPrice(b).ex);
    if (mode === 'cap')   arr.sort((a, b) => (parseFloat(b.capacity) || -1) - (parseFloat(a.capacity) || -1));
    if (mode === 'cpk')   arr.sort((a, b) => (calcCostPerKwh(a) ?? big) - (calcCostPerKwh(b) ?? big));
    return arr;
  }

  function rowHtml(p, showMaker) {
    const f = settings.features || {};
    const inCompare = compareList.some(c => c._id === p._id);
    const { ex, inTax } = getPrice(p);
    const cap = parseFloat(p.capacity);
    const hasCap = !isNaN(cap);

    const gauge = hasCap
      ? `<div class="gauge"><div class="gauge-cap">${esc(String(p.capacity).replace(/kWh$/i, ''))}<small>kWh</small></div>
           <div class="battery" aria-hidden="true"><i></i></div></div>`
      : `<div class="gauge v2h"><div class="gauge-cap">${p.type === 'V2H' ? 'V2H' : esc(p.capacity)}</div></div>`;

    const tags = [];
    if (p.type === 'ハイブリッド') tags.push('<span class="tag hybrid">ハイブリッド</span>');
    else if (p.type === 'V2H') tags.push('<span class="tag v2h">V2H</span>');
    else tags.push('<span class="tag">単機能</span>');
    if (p.load && p.load !== 'なし') tags.push(`<span class="tag">${esc(p.load)}</span>`);
    if (p.sochiku) tags.push('<span class="tag sochiku">創蓄連携割引</span>');
    const catalog = (f.catalog_link !== false && p.url)
      ? `<a class="catalog" href="${esc(p.url)}" target="_blank" rel="noopener">カタログを見る</a>` : '';
    const taxLine = f.show_tax_price !== false ? `<div class="price-tax">税込 ${yen(inTax)}円</div>` : '';
    const cmpBtn = f.compare_mode !== false
      ? `<button type="button" class="cmp" aria-pressed="${inCompare}"
           aria-label="${esc(p.maker + ' ' + p.name + ' ' + p.capacity)}を比較リストに${inCompare ? 'から外す' : '追加'}"
           onclick="toggleCompare(${p._id})">${inCompare ? '✓ 比較中' : '＋ 比較に追加'}</button>` : '';

    return `
      <div class="row ${inCompare ? 'in-compare' : ''}" id="row-${p._id}">
        ${gauge}
        <div class="info">
          <div class="info-name">${showMaker ? `<span class="cmp-maker">${esc(p.maker)}</span><br>` : ''}${esc(p.name)}</div>
          <div class="tags">${tags.join('')}${catalog}</div>
        </div>
        <div class="price">
          <div class="price-main">${yen(ex)}<small>円/月</small></div>
          ${taxLine}
        </div>
        ${cmpBtn}
      </div>`;
  }

  function renderCards(products) {
    const container = document.getElementById('lineup');
    document.getElementById('result-count').innerHTML = `<b>${products.length}</b> 件`;
    if (!products.length) {
      container.innerHTML = `<div class="no-result">この条件に合う製品はありません。<br>
        <button type="button" class="reset-btn" onclick="resetFilters()">条件をクリアして全件を表示</button></div>`;
      return;
    }
    const mode = document.getElementById('sort').value;
    const label = `月額・税抜（${leasePeriod}年リース）`;
    if (mode !== 'default') {
      container.innerHTML = `
        <section class="maker-section">
          <div class="maker-head"><h2>${{price:'月額が安い順',cap:'容量が大きい順',cpk:'1kWhあたりが安い順'}[mode]}</h2><span>${label}</span></div>
          <div class="rows">${sortProducts(products, mode).map(p => rowHtml(p, true)).join('')}</div>
        </section>`;
      return;
    }
    const grouped = {};
    products.forEach(p => { (grouped[p.maker] = grouped[p.maker] || []).push(p); });
    container.innerHTML = Object.entries(grouped).map(([maker, items]) => `
      <section class="maker-section">
        <div class="maker-head"><h2>${esc(maker)}</h2><span>${items.length}製品｜${label}</span></div>
        <div class="rows">${items.map(p => rowHtml(p, false)).join('')}</div>
      </section>`).join('');
  }

  function toggleCompare(id) {
    if ((settings.features || {}).compare_mode === false) return;
    const p = allProducts.find(p => p._id === id);
    const idx = compareList.findIndex(c => c._id === id);
    if (idx === -1) {
      if (compareList.length >= 6) { alert('比較できるのは最大6件です'); return; }
      compareList.push(p);
    } else {
      compareList.splice(idx, 1);
    }
    updateCompareBar();
    const row = document.getElementById('row-' + id);
    if (row) {
      const on = compareList.some(c => c._id === id);
      row.classList.toggle('in-compare', on);
      const btn = row.querySelector('.cmp');
      if (btn) { btn.setAttribute('aria-pressed', on); btn.textContent = on ? '✓ 比較中' : '＋ 比較に追加'; }
    }
  }

  function updateCompareBar() {
    const bar = document.getElementById('compare-bar');
    if (compareList.length === 0) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');
    document.getElementById('compare-count').textContent = `${compareList.length}件（最大6件）`;
    document.getElementById('compare-items').innerHTML = compareList.map(p => {
      const cpk = calcCostPerKwh(p);
      return `
        <div class="cb-item">
          <button type="button" class="cb-remove" onclick="toggleCompare(${p._id})" aria-label="比較リストから外す">✕</button>
          <div class="cb-item-name">${esc(p.maker)} ${esc(p.name)} ${esc(p.capacity)}</div>
          <div class="cb-item-price">${yen(getPrice(p).ex)}円${cpk ? `<small>1kWhあたり ${yen(cpk)}円</small>` : ''}</div>
        </div>`;
    }).join('');
  }

  function clearCompare() {
    compareList = [];
    updateCompareBar();
    applyFilters();
  }

  function openModal() {
    if (compareList.length < 2) { alert('2件以上選んでください'); return; }
    const f = settings.features || {};
    const costs = compareList.map(calcCostPerKwh).filter(v => v !== null);
    const bestCpk = costs.length ? Math.min(...costs) : null;
    const minEx = Math.min(...compareList.map(p => getPrice(p).ex));
    document.getElementById('modal-period').textContent = `${leasePeriod}年リース`;

    const head = compareList.map(p =>
      `<th scope="col"><div class="cmp-maker">${esc(p.maker)}</div><div class="cmp-name">${esc(p.name)}</div></th>`).join('');
    const row = (label, cells) => `<tr><th scope="row">${label}</th>${cells.join('')}</tr>`;

    const rows = [
      row('容量', compareList.map(p => `<td><span class="cmp-num">${esc(p.capacity)}</span></td>`)),
      row('月額（税抜）', compareList.map(p => {
        const ex = getPrice(p).ex;
        return `<td class="${ex === minEx ? 'best' : ''}"><span class="cmp-num">${yen(ex)}<small>円</small></span>${ex === minEx ? '<span class="best-mark">最安</span>' : ''}</td>`;
      })),
      f.show_tax_price !== false
        ? row('月額（税込）', compareList.map(p => `<td>${yen(getPrice(p).inTax)}円</td>`)) : '',
      row('1kWhあたり', compareList.map(p => {
        const c = calcCostPerKwh(p);
        const best = c !== null && c === bestCpk;
        return `<td class="${best ? 'best' : ''}">${c ? `<span class="cmp-num">${yen(c)}<small>円</small></span>` : '―'}${best ? '<span class="best-mark">コスパ最良</span>' : ''}</td>`;
      })),
      row('タイプ', compareList.map(p => `<td>${esc(p.type)}</td>`)),
      row('負荷タイプ', compareList.map(p => `<td>${esc(p.load)}</td>`)),
      row('創蓄連携割引', compareList.map(p => `<td>${p.sochiku ? '対象' : '―'}</td>`)),
    ].join('');

    document.getElementById('compare-table').innerHTML =
      `<table class="cmp-table"><thead><tr><th scope="row"></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
    document.getElementById('compare-modal').classList.add('open');
    document.querySelector('.modal-close').focus();
  }

  function closeModal() { document.getElementById('compare-modal').classList.remove('open'); }
  document.getElementById('compare-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
